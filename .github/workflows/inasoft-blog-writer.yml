name: inasoft-blog-writer

# INASOFT blog writer (pilot, PR-ONLY — never auto-merges)
# v1: manual dispatch only. Spec: prompts/inasoft-blog.md
# Generates one Bahasa Indonesia article per run, opens a PR on inasoft-site,
# notifies #inasoft, and leaves merge to a human.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and validate the article but do NOT push a branch or open a PR'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: inasoft-blog-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_FORMSPREE_FORM_ID: ${{ vars.PUBLIC_FORMSPREE_FORM_ID }}
      INASOFT_PAT: ${{ secrets.INASOFT_PAT }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      AI_PROVIDER: openrouter
      AI_FALLBACKS: openrouter,groq,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_INASOFT_CHANNEL_ID: ${{ secrets.SLACK_INASOFT_CHANNEL_ID }}
      DRY_RUN: ${{ inputs.dry_run }}
      SITE_DIR: ../site
    steps:
      - name: Checkout scheduler repo
        uses: actions/checkout@v4
        with:
          path: scheduler

      - name: Checkout inasoft-site
        uses: actions/checkout@v4
        with:
          repository: hendra/inasoft-site
          token: ${{ secrets.INASOFT_PAT }}
          path: site

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pillow (for cover generation)
        run: pip3 install Pillow

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund

      - name: Run blog writer
        working-directory: scheduler
        run: node scripts/inasoft-blog-writer.mjs
