name: github-trending

# GitHub Trending — Daily Top 10 → Slack #news
# scripts/github-trending-digest.mjs fetches the trending page (regex parse),
# fetches READMEs, calls the AI chain (OpenRouter preset → Groq → Cloudflare,
# via scripts/ai-providers.mjs) and posts to Slack. Triggered by the Cloudflare
# Worker scheduler (D1 row) via workflow_dispatch. No agent tool-calling.
# Note: `prompts/github-trending-daily.md` remains the human-readable spec for
# this task; the script is the executable form of it.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gather + compose the digest but do NOT post to Slack (print it instead)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-trending-daily
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: openrouter
      AI_FALLBACKS: openrouter,groq,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run digest pipeline
        run: node scripts/github-trending-digest.mjs
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify failure to Slack #news"
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
        run: |
          TEXT="⚠️ GitHub Trending daily digest failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_NEWS_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
