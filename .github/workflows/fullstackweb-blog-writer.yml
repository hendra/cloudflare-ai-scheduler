name: fullstackweb-blog-writer

# FullstackWeb.dev blog writer
# PR-ONLY — never auto-merges. Spec: prompts/fullstackweb-blog.md
# Generates one draft article per run, opens a PR on hendra/fullstackwebdev-site,
# notifies #fullstackwebdev, and leaves merge to a human. Triggered by the Cloudflare Worker
# scheduler (D1 row) via workflow_dispatch; AI via scripts/ai-providers.mjs
# (OpenRouter preset → Groq → Cloudflare).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and validate the article but do NOT push a branch or open a PR'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: fullstackweb-blog-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_FORMSPREE_FORM_ID: ${{ vars.PUBLIC_FORMSPREE_FORM_ID }}
      AI_PROVIDER: openrouter
      AI_FALLBACKS: openrouter,groq,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      SITE_DIR: ../site
    steps:
      - name: Checkout scheduler repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: scheduler

      - name: Checkout hendra/fullstackwebdev-site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: hendra/fullstackwebdev-site
          token: ${{ secrets.FULLSTACKWEB_PAT }}
          path: site

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.15.0

      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Pillow (for cover generation)
        run: pip3 install Pillow==13.0.0

      - name: Run blog writer
        working-directory: scheduler
        run: node scripts/fullstackweb-blog-writer.mjs
        env:
          FULLSTACKWEB_PAT: ${{ secrets.FULLSTACKWEB_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_FULLSTACKWEBDEV_CHANNEL_ID: ${{ secrets.SLACK_FULLSTACKWEBDEV_CHANNEL_ID }}

      - name: Notify failure to Slack
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('scheduler/failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_FULLSTACKWEBDEV_CHANNEL_ID: ${{ secrets.SLACK_FULLSTACKWEBDEV_CHANNEL_ID }}
        run: |
          TEXT="⚠️ FullstackWeb.dev blog writer failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_FULLSTACKWEBDEV_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
