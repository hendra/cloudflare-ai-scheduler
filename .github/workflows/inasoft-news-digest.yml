name: inasoft-news-digest

# INASOFT daily technology/AI digest → Slack #news (enabled via D1 row, cron '30 2 * * *')

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compose but do NOT post to Slack'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: inasoft-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      AI_PROVIDER: openrouter
      AI_FALLBACKS: openrouter,groq,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run digest pipeline
        run: node scripts/inasoft-news-digest.mjs

      - name: Notify Slack failure
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"channel":"'$SLACK_NEWS_CHANNEL_ID'","text":"⚠️ INASOFT news digest failed — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"}'
