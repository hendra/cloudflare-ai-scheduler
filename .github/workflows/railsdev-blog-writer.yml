name: railsdev-blog-writer

# RailsDev.io blog writer
# PR-ONLY — never auto-merges. Spec: docs/superpowers/specs/2026-11-11-railsdev-blog-writer-design.md
# Generates one draft article per run, opens a PR on hendra/railsdev-site,
# notifies #railsdev, and leaves merge to a human. Triggered by the Cloudflare Worker
# scheduler (D1 row) via workflow_dispatch; AI via scripts/ai-providers.mjs
# (OpenCode Console → OpenRouter).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and validate the article but do NOT push a branch or open a PR'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: railsdev-blog-writer
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_FORMSPREE_FORM_ID: ${{ vars.PUBLIC_FORMSPREE_FORM_ID }}
      AI_PROVIDER: opencode
      AI_FALLBACKS: opencode,openrouter
      AI_MODEL: ${{ vars.AI_MODEL }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      SITE_DIR: ../site
    steps:
      - name: Checkout scheduler repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: scheduler

      - name: Checkout hendra/railsdev-site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: hendra/railsdev-site
          token: ${{ secrets.RAILSDEV_PAT }}
          path: site

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Install Pillow (for cover generation)
        run: pip3 install Pillow==13.0.0

      - name: Run blog writer
        working-directory: scheduler
        run: node scripts/railsdev-blog-writer.mjs
        env:
          RAILSDEV_PAT: ${{ secrets.RAILSDEV_PAT }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RAILSDEV_CHANNEL_ID: ${{ secrets.SLACK_RAILSDEV_CHANNEL_ID }}

      - name: Notify failure to Slack
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('scheduler/failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_RAILSDEV_CHANNEL_ID: ${{ secrets.SLACK_RAILSDEV_CHANNEL_ID }}
        run: |
          TEXT="⚠️ RailsDev.io blog writer failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_RAILSDEV_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
