name: github-trending-weekly

# GitHub Trending — Weekly Top 10 → Slack #news
# Same pipeline as github-trending.yml (scripts/github-trending-digest.mjs)
# with WEEKLY=true: fetches github.com/trending?since=weekly, covers the previous
# Monday–Sunday (Asia/Jakarta), posts a "Top 10 of the Week" digest split into
# two consecutive messages (header + repos 1–5, then repos 6–10 + trends).
# Spec: prompts/github-trending-weekly.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Gather + compose the digest but do NOT post to Slack (print it instead)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-trending-weekly
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEEKLY: "true"
      AI_PROVIDER: opencode
      AI_FALLBACKS: opencode,openrouter,groq,gemini,kilo,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run weekly digest pipeline
        run: node scripts/github-trending-digest.mjs
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Notify failure to Slack #news"
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
        run: |
          TEXT="⚠️ GitHub Trending weekly digest failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_NEWS_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
