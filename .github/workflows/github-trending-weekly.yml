name: github-trending-weekly

# GitHub Trending — Weekly Top 10 → Slack #news
# Same deterministic pipeline as github-trending.yml (scripts/github-trending-digest.mjs)
# with WEEKLY=true: fetches github.com/trending?since=weekly, covers the previous
# Monday–Sunday (Asia/Jakarta), posts a "Top 10 of the Week" digest split into
# two consecutive messages (header + repos 1–5, then repos 6–10 + trends).
# Spec: prompts/github-trending-weekly.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Gather + compose the digest but do NOT post to Slack (print it instead)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-trending-weekly
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEEKLY: "true"
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      AI_PROVIDER: openrouter
      AI_FALLBACKS: openrouter,groq,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run weekly digest pipeline
        run: node scripts/github-trending-digest.mjs

      - name: "Notify failure to Slack #news"
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\": \"${SLACK_NEWS_CHANNEL_ID}\", \"text\": \"⚠️ GitHub Trending weekly digest failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
