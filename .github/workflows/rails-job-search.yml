name: rails-job-search

# Rails — Remote Job Search → Slack #jobs
# Runs scripts/rails-job-search.mjs: fetches Remotive + Remote OK + HN
# "Who is hiring" (We Work Remotely is Cloudflare-gated, skipped), scores
# candidates via the AI chain (OpenCode Console → OpenRouter,
# via scripts/ai-providers.mjs), and posts the digest to #jobs.
# `prompts/rails-job-search.md` remains the human-readable spec.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gather + compose the digest but do NOT post to Slack (print it instead)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rails-job-search
  cancel-in-progress: false

jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_PROVIDER: opencode
      AI_FALLBACKS: opencode,openrouter,groq,gemini,cloudflare
      AI_MODEL: ${{ vars.AI_MODEL }}
      OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
      OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Run job search pipeline
        run: node scripts/rails-job-search.mjs
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_JOBS_CHANNEL_ID: ${{ secrets.SLACK_JOBS_CHANNEL_ID }}

      - name: "Notify failure to Slack #jobs"
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_JOBS_CHANNEL_ID: ${{ secrets.SLACK_JOBS_CHANNEL_ID }}
        run: |
          TEXT="⚠️ Rails job search failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_JOBS_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
