name: ig-reel

# IG Reel — Interesting Facts & Knowledge → Instagram @kaliajatau.id (via Buffer)
# Deterministic RSS fetch → Buffer 7-day dedup → AI picks 4–5 grounded findings
# (Bahasa Indonesia; AI chain: OpenCode Console → OpenRouter, via scripts/ig_reel_daily.py)
# → HTML scenes (headless Chrome) → reel assembled from synthesised original music →
# Cloudinary hosting → Buffer createPost (reel, shareNow, isAiGenerated).
# Triggered by the Cloudflare Worker scheduler (D1 row) via workflow_dispatch.
# DRY_RUN=true composes everything but skips the upload and post.
# Images: provider chain cloudflare → google → huggingface → pollinations
# (POLLINATIONS_SECRET_KEY keyed modern endpoint; fallback to classic per-IP free tier).
# Cloudinary is hosting/upload only — never used for image generation.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compose the Reel but do NOT upload to Cloudinary or post to Buffer'
        required: false
        default: true
        type: boolean
      topic:
        description: 'Optional topic hint (prioritised when relevant)'
        required: false
        default: ''
      placeholder_images:
        description: 'Dev only: flat-colour illustrations instead of Cloudflare images (proves render/upload path when CF quota is exhausted)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ig-reel-daily
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TOPIC: ${{ inputs.topic }}
      PLACEHOLDER_IMAGES: ${{ inputs.placeholder_images || 'false' }}
      # scripts/ig_reel_daily.py maps CF_ACCOUNT_ID/CF_API_TOKEN → CF_ACCOUNT/CF_TOKEN automatically
      GOOGLE_IMAGE_MODEL: gemini-nano-banana-2.1
      HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
      IMAGE_ORDER: cloudflare,google,huggingface,pollinations
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow==13.0.0 numpy==2.4.6 scipy==1.17.1 playwright==1.65.1

      - name: Ensure a Chrome binary for render_html.py
        run: |
          if ! command -v google-chrome; then
            python -m playwright install --with-deps chromium
            CHROME=$(python -c "import glob,os; p=glob.glob(os.path.expanduser('~/.cache/ms-playwright/chromium-*/chrome-linux/chrome')); print(p[0] if p else '')")
            if [ -n "$CHROME" ] && [ ! -e /usr/bin/google-chrome ]; then sudo ln -s "$CHROME" /usr/bin/google-chrome; fi
          fi
          command -v google-chrome && google-chrome --version

      - name: Run IG Reel pipeline
        run: python scripts/ig_reel_daily.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_SECRET_KEY: ${{ secrets.POLLINATIONS_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}

      - name: Notify failure to Slack #news
        if: failure() && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
        run: |
          TEXT="⚠️ IG Reel daily run failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_NEWS_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
