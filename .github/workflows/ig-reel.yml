name: ig-reel

# IG Reel — Interesting Facts & Knowledge → Instagram @kaliajatau.id (via Buffer)
# Prompt 1 (prompts/ig-reel-daily.md) in executable form: deterministic RSS fetch
# → Buffer 7-day dedup → AI picks 4–5 grounded findings (Bahasa Indonesia) →
# HTML scenes (headless Chrome) → reel assembled from synthesised original music →
# Cloudinary hosting → Buffer createPost (reel, shareNow, isAiGenerated).
# DRY_RUN=true composes everything but skips the upload and post.
# Images: Cloudflare Workers AI via cf_image.py only (never Cloudinary generation).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compose the Reel but do NOT upload to Cloudinary or post to Buffer'
        required: false
        default: true
        type: boolean
      topic:
        description: 'Optional topic hint (prioritised when relevant)'
        required: false
        default: ''
      placeholder_images:
        description: 'Dev only: flat-colour illustrations instead of Cloudflare images (proves render/upload path when CF quota is exhausted)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ig-reel-daily
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      TOPIC: ${{ inputs.topic }}
      PLACEHOLDER_IMAGES: ${{ inputs.placeholder_images }}
      # scripts/ig_reel_daily.py maps CF_ACCOUNT_ID/CF_API_TOKEN → CF_ACCOUNT/CF_TOKEN automatically
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # optional image fallbacks (free tiers; skipped silently when unset):
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GOOGLE_IMAGE_MODEL: gemini-nano-banana-2.1
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
      IMAGE_ORDER: cloudflare,google,huggingface,pollinations
      # Pollinations secret key (sk_…) — unlimited image API at gen.pollinations.ai (no watermark)
      POLLINATIONS_SECRET_KEY: ${{ secrets.POLLINATIONS_SECRET_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
      BUFFER_ORG_ID: ${{ vars.BUFFER_ORG_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy scipy playwright

      - name: Ensure a Chrome binary for render_html.py
        run: |
          if ! command -v google-chrome; then
            python -m playwright install --with-deps chromium
            CHROME=$(python -c "import glob,os; p=glob.glob(os.path.expanduser('~/.cache/ms-playwright/chromium-*/chrome-linux/chrome')); print(p[0] if p else '')")
            if [ -n "$CHROME" ] && [ ! -e /usr/bin/google-chrome ]; then sudo ln -s "$CHROME" /usr/bin/google-chrome; fi
          fi
          command -v google-chrome && google-chrome --version

      - name: Run IG Reel pipeline
        run: python scripts/ig_reel_daily.py

      - name: "Notify failure to Slack #news"
        if: failure() && env.DRY_RUN != 'true'
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"channel\": \"${SLACK_NEWS_CHANNEL_ID}\", \"text\": \"⚠️ IG Reel pipeline failed — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
