name: ig-reel

# IG Reel — one workflow for every Instagram account (posted via Buffer).
# The `account` input picks scripts/ig_reel/accounts/<account>.json (handle, niche, feeds, tip
# themes, pinned Buffer channel + Cloudinary cloud) and the GitHub environment `ig-<account>`
# that holds that account's own secrets under the secret names below. An environment secret
# overrides the repo-level one of the same name; a missing one falls back to repo level, and the
# script's wrong-account guard then refuses a real post. Add an account: docs/ig-reel-add-account.md
#   kaliajatau (default) — Interesting Facts & Knowledge, @kaliajatau.id; repo-level secrets.
#   ai-labs              — Claude/ChatGPT/Gemini creative tips (photo, video, animation): announcement in the morning slot, else a theme tip.
# Per run: RSS fetch → Buffer dedup → ONE story written only from an article (every number
# checked) or one theme tip (no prices/versions/big numbers), Bahasa Indonesia → 4 cinematic
# illustrations → animated HTML scenes captured frame-by-frame + composed beat-synced music
# (scripts/ig_reel/) → Cloudinary hosting → Buffer createPost (reel, shareNow, isAiGenerated,
# cover = frame 0). Specs: docs/superpowers/specs/2026-11-15-ig-reel-cinematic-redesign-design.md,
# docs/superpowers/specs/2026-11-15-ig-reel-multi-account-design.md
# Triggered by the Cloudflare Worker scheduler (D1 rows) via workflow_dispatch.
# DRY_RUN=true composes everything but skips the upload and post.
# Images: provider chain cloudflare → google → huggingface → pollinations
# (POLLINATIONS_SECRET_KEY keyed modern endpoint; fallback to classic per-IP free tier).
# Cloudinary is hosting/upload only — never used for image generation.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compose the Reel but do NOT upload to Cloudinary or post to Buffer'
        required: false
        default: true
        type: boolean
      account:
        description: 'Account id = scripts/ig_reel/accounts/<id>.json and environment ig-<id>'
        required: false
        default: 'kaliajatau'
      mode:
        description: 'Dev only: force the story mode (auto = announcement in news slots, else tip)'
        required: false
        default: auto
        type: choice
        options: [auto, news, tip]
      topic:
        description: 'Optional topic hint (prioritised when relevant; in tip mode it replaces the theme)'
        required: false
        default: ''
      placeholder_images:
        description: 'Dev only: flat-colour illustrations instead of Cloudflare images (proves render/upload path when CF quota is exhausted)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ig-reel-${{ inputs.account || 'kaliajatau' }}
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ig-${{ inputs.account || 'kaliajatau' }}
    env:
      ACCOUNT: ${{ inputs.account || 'kaliajatau' }}
      MODE: ${{ inputs.mode || 'auto' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
      TOPIC: ${{ inputs.topic }}
      PLACEHOLDER_IMAGES: ${{ inputs.placeholder_images || 'false' }}
      # scripts/ig_reel_daily.py maps CF_ACCOUNT_ID/CF_API_TOKEN → CF_ACCOUNT/CF_TOKEN automatically
      GOOGLE_IMAGE_MODEL: gemini-nano-banana-2.1
      HF_IMAGE_MODEL: black-forest-labs/FLUX.1-schnell
      IMAGE_ORDER: cloudflare,google,huggingface,pollinations
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core fonts-noto-color-emoji
          # CTA/payoff emoji render as tofu boxes without this font — fail early instead of posting them
          fc-list | grep -qi "Noto Color Emoji" || { echo "::error::Noto Color Emoji font missing"; exit 1; }

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow==13.0.0 numpy==2.4.6 scipy==1.17.1 playwright==1.65.1

      - name: Ensure a Chrome binary (scene capture)
        run: |
          if ! command -v google-chrome; then
            python -m playwright install --with-deps chromium
            CHROME=$(python -c "import glob,os; p=glob.glob(os.path.expanduser('~/.cache/ms-playwright/chromium-*/chrome-linux/chrome')); print(p[0] if p else '')")
            if [ -n "$CHROME" ] && [ ! -e /usr/bin/google-chrome ]; then sudo ln -s "$CHROME" /usr/bin/google-chrome; fi
          fi
          command -v google-chrome && google-chrome --version

      - name: Run IG Reel pipeline
        run: python scripts/ig_reel_daily.py
        env:
          SCHEDULER_URL: ${{ vars.SCHEDULER_URL }}
          MANUAL_RUN_TOKEN: ${{ secrets.MANUAL_RUN_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_SECRET_KEY: ${{ secrets.POLLINATIONS_SECRET_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}
          OPENCODE_BASE_URL: ${{ vars.OPENCODE_BASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}

      - name: Upload dry-run Reel for review
        if: always() && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ig-reel-dry-run-${{ inputs.account || 'kaliajatau' }}
          path: |
            .ig-reel-out/ig_reel.mp4
            .ig-reel-out/frames_sample/*.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify failure to Slack #news
        # cancelled() too: a run killed by timeout-minutes is 'cancelled', not 'failure', and fail() never ran
        if: (failure() || cancelled()) && env.DRY_RUN != 'true' && !hashFiles('failure-posted')
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_NEWS_CHANNEL_ID: ${{ secrets.SLACK_NEWS_CHANNEL_ID }}
        run: |
          TEXT="⚠️ IG Reel (${ACCOUNT}) run failed and no note was posted — see https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg ch "${SLACK_NEWS_CHANNEL_ID}" --arg text "${TEXT}" '{channel:$ch, text:$text}')"
